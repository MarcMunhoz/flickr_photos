services:
  app:
    build:
      context: .
      target: develop
      no_cache: true
    image: flickr-gallery_img
    volumes:
      - ./app:/app
    working_dir: /app
    container_name: "flickr-gallery_ctn"
    hostname: "flickr-gallery_hst"
    ports:
      - 2469:2469
      - 3000:3000
    entrypoint: /bin/sh -c "yarn && yarn dev"
    # Replace the entrypoint with a long sleep when inspecting the container manually.
    # entrypoint: ["sh", "-c", "sleep 2073600"]

  e2e:
    profiles:
      - test
    build:
      context: .
      target: test
      no_cache: true
    image: flickr-gallery_test_img
    volumes:
      - ./app:/app
    working_dir: /app
    environment:
      CYPRESS_BASE_URL: http://app:2469
    depends_on:
      - app
    entrypoint: ["yarn", "test:e2e"]
